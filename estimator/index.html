<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wichita Lawn Care | Job Estimator</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#193126;font:16px system-ui}main{max-width:760px;margin:auto;padding:16px}header{background:#174c32;color:white;padding:22px;border-radius:16px}h1{font-size:24px;margin:0}h2{font-size:19px}section{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:600}input,select,button{font:inherit;border:1px solid #cbd5ce;border-radius:8px;padding:11px;width:100%;margin-top:5px}input[type=checkbox]{width:auto}button{background:#174c32;color:white;cursor:pointer}.step{display:flex;gap:8px}.big{font-size:34px;font-weight:800;color:#174c32}.muted{color:#56665e;font-size:13px}.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center}.scenario{background:#f3f5f4;border-radius:8px;padding:8px 3px;font-size:13px;overflow-wrap:anywhere}.scenario b{display:block;font-size:15px;margin:5px 0 12px}.bararea{height:140px;display:flex;align-items:flex-end;justify-content:center}.bar{width:65%;border-radius:5px 5px 0 0}.early{background:#16834b}.normal{background:#64748b}.late{background:#c56a16}.negative{color:#b91c1c}details summary{cursor:pointer;font-weight:bold}output{display:block}footer{font-size:12px;color:#56665e}</style><main><header><h1>Wichita Lawn Care LLC</h1>Smart Job Estimator</header><section><label>Service<select id="service"><option>Yard cleanup</option><option>Lawn mowing</option><option>Leaf removal</option><option>Landscaping</option><option>Tree work</option><option>Junk removal</option><option>Aeration and overseeding</option><option>Snow removal</option><option>Other</option></select></label><div class="grid"><label>Employees (excluding you)<input id="crew" type="number" min="0" step="1" value="1"></label><label>Hours on job<input id="hours" type="number" min="0" step="0.25" value="2.5"></label></div><div class="step"><button id="minus">− 15 min</button><button id="plus">+ 15 min</button></div><p><label><input id="owner" type="checkbox" checked> I'm working on this job</label></p><output id="crewinfo"></output></section><section><h2>Rates and expenses</h2><div class="grid" id="fields"></div></section><section><div class="muted">Recommended customer price</div><output class="big" id="price"></output><div class="grid" id="summary"></div><button id="copy">Copy customer estimate</button><output id="status" aria-live="polite"></output></section><section><h2>Estimate accuracy analysis</h2><label>Time error<select id="variance"><option value=".5">± 30 minutes</option><option value="1" selected>± 1 hour</option><option value="2">± 2 hours</option><option value="3">± 3 hours</option></select></label><p class="muted" id="fixed"></p><div class="compare" id="comparison"></div><p id="protection"></p></section><footer>Gross profit before general overhead and taxes. Nonlabor expenses remain fixed in all scenarios. No customer data is collected or sent. Settings are stored only in this browser.</footer></main><script>
const $=id=>document.getElementById(id), fields=[['rate','Billing rate / man-hour',75],['wage','Employee wage / hour',20],['burden','Payroll burden (%)',25],['ow','Owner cost / hour',0],['materials','Materials ($)',0],['equipment','Fuel and equipment ($)',30],['disposal','Disposal ($)',35],['sub','Subcontractor ($)',0],['margin','Minimum margin (%)',35],['target','Daily profit target ($)',1000]];
for(const [id,label,value] of fields){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');Object.assign(i,{id,type:'number',min:'0',step:'any',value:String(value)});l.append(i);$('fields').append(l)}
const inputs=[...document.querySelectorAll('input,select')];try{const saved=JSON.parse(localStorage.getItem('wlc-estimator-v1')||'{}');for(const i of inputs)if(Object.hasOwn(saved,i.id)){if(i.type==='checkbox')i.checked=!!saved[i.id];else i.value=saved[i.id]}}catch{}
const n=id=>Math.max(0,Number($(id).value)||0), money=v=>v.toLocaleString('en-US',{style:'currency',currency:'USD'});let price=0;
function render(){const h=n('hours'),crew=Math.floor(n('crew')),owner=$('owner').checked,people=crew+Number(owner),extra=n('materials')+n('equipment')+n('disposal')+n('sub'),pay=crew*n('wage')*(1+n('burden')/100),hourly=pay+(owner?n('ow'):0),cost=t=>extra+t*hourly,quote=t=>Math.ceil(Math.max(t*people*n('rate')+extra,cost(t)/(1-Math.min(95,n('margin'))/100))/5)*5;price=quote(h);const profit=price-cost(h),v=n('variance'),pct=p=>price?(100*p/price).toFixed(1)+'%':'—';$('crewinfo').textContent=people+' total crew · '+(owner?h:0)+' owner hours · '+(people*h)+' man-hours';$('price').textContent=money(price);$('summary').innerHTML=[['Job cost',money(cost(h))],['Gross profit',money(profit)],['Employee payroll',money(pay*h)],['Margin',pct(profit)],['Daily goal achieved',n('target')?(profit/n('target')*100).toFixed(1)+'%':'—'],['Remaining daily goal',money(Math.max(0,n('target')-profit))]].map(([a,b])=>'<div class="muted">'+a+'<br><strong style="font-size:19px;color:#193126">'+b+'</strong></div>').join('');$('fixed').textContent='Fixed customer quote: '+money(price);const scenarios=[['Early',Math.max(0,h-v),'early'],['Estimated',h,'normal'],['Late',h+v,'late']];const max=Math.max(1,...scenarios.map(s=>Math.abs(price-cost(s[1]))));$('comparison').innerHTML=scenarios.map(([name,t,cls])=>{const p=price-cost(t);return '<div class="scenario"><strong>'+name+'</strong><br>'+t+' hrs<b class="'+(p<0?'negative':'')+'">'+money(p)+'</b><div class="bararea"><div class="bar '+cls+'" style="height:'+Math.abs(p)/max*100+'%;'+(p<0?'background:#b91c1c':'')+'"></div></div><small>Gross profit'+(p<0?' (loss)':'')+'</small><hr>Profit change<b>'+money(p-profit)+'</b>Job cost<b>'+money(cost(t))+'</b>Margin<b>'+pct(p)+'</b>Ideal quote<b>'+money(quote(t))+'</b>Revenue/man-hr<b>'+(t*people?money(price/(t*people)):'—')+'</b></div>'}).join('');$('protection').textContent='Extra hourly cost: '+money(hourly)+' · Quote to protect estimated profit: '+money(price+hourly*v);try{localStorage.setItem('wlc-estimator-v1',JSON.stringify(Object.fromEntries(inputs.map(i=>[i.id,i.type==='checkbox'?i.checked:i.value]))))}catch{}}
inputs.forEach(i=>i.addEventListener('input',render));$('minus').onclick=()=>{$('hours').value=Math.max(0,n('hours')-.25);render()};$('plus').onclick=()=>{$('hours').value=n('hours')+.25;render()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText('Wichita Lawn Care LLC\nService: '+$('service').value+'\nEstimated price: '+money(price));$('status').textContent='Copied.'}catch{$('status').textContent='Clipboard unavailable. Select and copy the price manually.'}};render();
</script></html>
